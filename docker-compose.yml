services:
  mongodb:
    image: mongo:8.0
    container_name: franchise-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: franchise-api
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://admin:admin2026$@mongodb:27017/franchises?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data: