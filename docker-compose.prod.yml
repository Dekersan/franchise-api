services:
  app:
    build: .
    container_name: franchise-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:8080"
    environment:
      MONGODB_URI: ${MONGODB_URI}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3